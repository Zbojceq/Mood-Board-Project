{% extends 'side_menu.html' %}

{% block main %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="static/settings.css">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="static/settings.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="lottie-container">
                <lottie-player src="https://lottie.host/0317a4ce-77a4-4a99-bbf3-720197af7d98/amAT1mWdeH.json" 
                    background="transparent" 
                    speed="1" 
                    style="width: 300px; height: 300px;" 
                    loop autoplay>
                </lottie-player>
            </div>

            <div class="settings-box">
                <h2>Account Settings</h2>
                <div class="account-info-row">
                    <span id="current-username"></span>
                    <button class="change-btn" id="change-username-btn">Change Username</button>
                </div>
                <div class="account-info-row">
                    <span id="current-email"></span>
                    <button class="change-btn" id="change-email-btn">Change Email</button>
                </div>
                <div class="account-info-row">
                    <span>Password: ••••••••</span>
                    <button class="change-btn" id="change-password-btn">Change Password</button>
                </div>
            </div>

            <!-- Popups -->
            <div class="popup" id="popup-username">
                <div class="popup-content">
                    <h3>Change Username</h3>
                    <form id="form-username">
                        <input type="password" name="password" placeholder="Current Password" required>
                        <input type="text" name="new_username" placeholder="New Username" required>
                        <div class="popup-error" id="error-username"></div>
                        <div class="popup-buttons">
                            <button type="submit">Save</button>
                            <button type="button" class="close-popup">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="popup" id="popup-email">
                <div class="popup-content">
                    <h3>Change Email</h3>
                    <form id="form-email">
                        <input type="password" name="password" placeholder="Current Password" required>
                        <input type="email" name="new_email" placeholder="New Email" required>
                        <div class="popup-error" id="error-email"></div>
                        <div class="popup-buttons">
                            <button type="submit">Save</button>
                            <button type="button" class="close-popup">Cancel</button>
                        </div>
                    </form>  
                </div>
            </div>
            <div class="popup" id="popup-password">
                <div class="popup-content">
                    <h3>Change Password</h3>
                    <form id="form-password">
                        <input type="password" name="old_password" placeholder="Current Password" required>
                        <input type="password" name="new_password1" placeholder="New Password" required>
                        <input type="password" name="new_password2" placeholder="Repeat New Password" required>
                        <div class="popup-error" id="error-password"></div>
                        <div class="popup-buttons">
                            <button type="submit">Save</button>
                            <button type="button" class="close-popup">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="delete-account-section">
                <button id="delete-account-btn">Delete Account</button>
            </div>

            <!-- Delete Account Popup -->
            <div class="popup" id="popup-delete-account">
                <div class="popup-content">
                    <h3>Delete Account</h3>
                    <form id="form-delete-account">
                        <input type="password" name="password" placeholder="Current Password" required>
                        <input type="text" name="confirm_text" placeholder="Type 'confirm' to delete" required>
                        <div class="popup-error" id="error-delete-account"></div>
                        <div class="popup-buttons">
                            <button type="submit" style="background:#d32f2f;">Delete</button>
                            <button type="button" class="close-popup">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
{% endblock %}
