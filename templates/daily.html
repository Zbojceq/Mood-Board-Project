{% extends 'side_menu.html' %}

{% block main %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoodBoard - Widok Dzienny</title>
  <style>
    :root {
      --primary: #7c3aed;
      --bg: #f0f4f8;
      --white: #ffffff;
      --text: #1f2937;
      --accent-yellow: #fde047;
      --accent-green: #4ade80;
      --accent-orange: #fb923c;
      --accent-blue: #60a5fa;
      --gray: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #e0e7ff);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      margin-left: 80px;
    }

    .main {
      flex: 1;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .top-bar h1 {
      font-size: 32px;
      background: linear-gradient(90deg, #6366f1, #9333ea);
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      font-weight: bold;
    }

    .view-switch {
      display: flex;
      gap: 12px;
    }

    .view-switch button {
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
      color: #1f2937;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s;
    }

    .view-switch button:hover {
      transform: scale(1.05);
    }

    .day-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .day-nav button {
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
      color: #1f2937;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .day-nav button:hover {
      transform: scale(1.05);
    }

    .selected-day {
      font-size: 24px;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 20px;
      text-align: center;
      color: var(--primary);
    }

    .time-slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .time-slot {
      background-color: var(--white);
      border-radius: 14px;
      padding: 30px 20px 28px 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .time-slot:hover {
      background-color: #e0e7ff;
      transform: scale(1.04);
    }

    .mood-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      margin-left: auto;
      margin-right: auto;
      z-index: 2;
    }

    .mood-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid #ccc;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .log-detail-card {
      background: linear-gradient(145deg, #ffe0f0, #e0f7ff);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.13);
      max-width: 400px;
      width: 95vw;
      animation: fadeIn 0.7s ease-out;
      text-align: center;
      position: relative;
    }
    .log-detail-card h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
      background: linear-gradient(to right, #8e44ad, #f39c12);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .log-detail-dot {
      width: 22px; height: 22px; border-radius: 50%; display: inline-block; margin-bottom: -5px; margin-right: 8px; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .log-detail-row {
      margin: 0.7em 0; font-size: 1.1em; display: flex; align-items: center; justify-content: center;
    }
    .log-detail-label { font-weight: bold; margin-right: 8px; color: #6a1b9a; }
    .close-log-detail {
      background: linear-gradient(to right, #8e44ad, #f39c12);
      color: white;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      margin-top: 1.5rem;
      width: 80%;
      transition: background 0.3s;
    }
    .close-log-detail:hover {
      background: linear-gradient(to right, #9b59b6, #e67e22);
    }
    .return-to-logs-btn {
      background: linear-gradient(to right, #60a5fa, #38bdf8);
      color: white;
      padding: 0.4rem 1.2rem;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 1.2rem;
      width: 60%;
      transition: background 0.3s;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .return-to-logs-btn:hover {
      background: linear-gradient(to right, #2563eb, #0ea5e9);
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="top-bar">
      <h1>📌 Daily</h1>
      <div class="view-switch">
        <button onclick="window.location.href='/main'">Monthly/Weekly</button>
      </div>
    </div>

    <div class="day-nav">
      <button id="prevDayBtn">←</button>
      <div class="selected-day" id="selectedDay">15 June 2025</div>
      <button id="nextDayBtn">→</button>
    </div>

    <div class="time-slots" id="timeSlots"></div>
  </div>

  <!-- Log Detail Modal -->
  <div id="logDetailModal" class="modal" style="display:none;">
    <div class="log-detail-card">
      <h2>Log Details</h2>
      <div id="logDetailContent"></div>
    </div>
  </div>

  <script>
    const logs = {{ logs|tojson }};
    const periods = [
      { label: "00:00-02:00", start: 0, end: 2 },
      { label: "02:00-04:00", start: 2, end: 4 },
      { label: "04:00-06:00", start: 4, end: 6 },
      { label: "06:00-08:00", start: 6, end: 8 },
      { label: "08:00-10:00", start: 8, end: 10 },
      { label: "10:00-12:00", start: 10, end: 12 },
      { label: "12:00-14:00", start: 12, end: 14 },
      { label: "14:00-16:00", start: 14, end: 16 },
      { label: "16:00-18:00", start: 16, end: 18 },
      { label: "18:00-20:00", start: 18, end: 20 },
      { label: "20:00-22:00", start: 20, end: 22 },
      { label: "22:00-24:00", start: 22, end: 24 }
    ];

    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];

    const selectedDayElem = document.getElementById('selectedDay');
    const container = document.getElementById('timeSlots');

    let currentDate = new Date();

    function formatDate(date) {
      const day = date.getDate();
      const month = monthNames[date.getMonth()];
      const year = date.getFullYear();
      return `${day} ${month} ${year}`;
    }

    function getLogsForDate(date) {
      const dateStr = date.toISOString().slice(0, 10);
      return logs.filter(log => log.event_date === dateStr);
    }

    function getLogsForPeriod(logsForDay, period) {
      return logsForDay.filter(log => {
        if (!log.event_time) return false;
        const hour = parseInt(log.event_time.split(':')[0], 10);
        return hour >= period.start && hour < period.end;
      });
    }

    function showLogDetailDaily(log, logsForPeriod) {
      const modal = document.getElementById('logDetailModal');
      const content = document.getElementById('logDetailContent');
      let returnBtn = '';
      if (logsForPeriod && logsForPeriod.length > 1) {
        returnBtn = '<button class="return-to-logs-btn" id="returnToListBtn">Return to logs</button>';
      } else {
        returnBtn = '<button class="close-log-detail" onclick="closeLogDetailDaily()">Return</button>';
      }
      content.innerHTML = `
        <div class="log-detail-row">
          <span class="log-detail-label">Hour:</span> ${log.event_time || '—'}
        </div>
        <div class="log-detail-row">
          <span class="log-detail-dot" style="background:${log.emotion_color}"></span>
          <span class="log-detail-label">${log.emotion_description} ${log.emotion_emoticon || ''}</span>
        </div>
        <div class="log-detail-row">
          <span class="log-detail-label">Description:</span> ${log.description}
        </div>
        ${returnBtn}
      `;
      modal.style.display = 'flex';
      if (logsForPeriod && logsForPeriod.length > 1) {
        document.getElementById('returnToListBtn').onclick = function() {
          showLogListDaily(logsForPeriod);
        };
      }
    }
    function showLogListDaily(logsForPeriod) {
      let html = '<div style="margin-bottom:1em;">Multiple logs for this period:</div>';
      logsForPeriod.forEach((log, idx) => {
        html += `<div class='log-detail-row' style='cursor:pointer;' data-log-idx='${idx}'>
          <span class='log-detail-dot' style='background:${log.emotion_color}'></span>
          <span>${log.event_time || ''} ${log.emotion_description} ${log.emotion_emoticon || ''}</span>
        </div>`;
      });
      html += '<button class="close-log-detail" onclick="closeLogDetailDaily()">Return</button>';
      document.getElementById('logDetailContent').innerHTML = html;
      Array.from(document.querySelectorAll('#logDetailContent .log-detail-row')).forEach((el, idx) => {
        el.onclick = () => showLogDetailDaily(logsForPeriod[idx], logsForPeriod);
      });
      document.getElementById('logDetailModal').style.display = 'flex';
    }
    function closeLogDetailDaily() {
      document.getElementById('logDetailModal').style.display = 'none';
    }

    function renderTimeSlots(date) {
      container.innerHTML = '';
      const logsForDay = getLogsForDate(date);
      periods.forEach(period => {
        const slot = document.createElement('div');
        slot.className = 'time-slot';
        slot.innerText = period.label;
        const logsInPeriod = getLogsForPeriod(logsForDay, period);

        


        // Add mood dots for each log in this period
        if (logsInPeriod.length > 0) {
          const dotsContainer = document.createElement('div');
          dotsContainer.className = 'mood-dots';
          logsInPeriod.forEach(log => {
            const dot = document.createElement('div');
            dot.className = 'mood-dot';
            dot.style.backgroundColor = log.emotion_color;
            dot.title = `${log.emotion_description} ${log.emotion_emoticon || ''}`;
            dotsContainer.appendChild(dot);
          });
          slot.appendChild(dotsContainer);
        }
        const now = new Date();
        const slotDate = new Date(date);
        slotDate.setHours(period.start, 0, 0, 0);
        if (slotDate > now) {
          slot.style.opacity = '0.4';
          slot.style.cursor = 'default';
          slot.onclick = null;
        } else {
          // Show log details on click
          slot.onclick = () => {
            if (logsInPeriod.length === 0) {
              alert(`No Logs for ${period.label}`);
            } else if (logsInPeriod.length === 1) {
              showLogDetailDaily(logsInPeriod[0], logsInPeriod);
            } else {
              showLogListDaily(logsInPeriod);
            }
          };
        }
        container.appendChild(slot);
      });
    }

    function updateView() {
      selectedDayElem.textContent = formatDate(currentDate);
      renderTimeSlots(currentDate);
    }

    document.getElementById('prevDayBtn').onclick = () => {
      currentDate.setDate(currentDate.getDate() - 1);
      updateView();
    };

    document.getElementById('nextDayBtn').onclick = () => {
      currentDate.setDate(currentDate.getDate() + 1);
      updateView();
    };

    updateView();
  </script>
</body>
</html>
{% endblock %}
